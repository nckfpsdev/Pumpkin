<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Ambient Glow -->
    <radialGradient id="p-ambient" cx="50%" cy="60%" r="50%">
      <stop offset="0%" stop-color="#FF7A00" stop-opacity="0.38" />
      <stop offset="60%" stop-color="#FF6A00" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#FF7A00" stop-opacity="0" />
    </radialGradient>

    <!-- Ground Shadow -->
    <radialGradient id="p-shadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.75" />
      <stop offset="70%" stop-color="#000000" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Pumpkin Stem Gradients -->
    <linearGradient id="p-stem" x1="0%" y1="100%" x2="40%" y2="0%">
      <stop offset="0%" stop-color="#1C1917" />
      <stop offset="35%" stop-color="#2D3A18" />
      <stop offset="70%" stop-color="#4D7C0F" />
      <stop offset="100%" stop-color="#65A30D" />
    </linearGradient>

    <linearGradient id="p-stem-highlight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#84CC16" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#365314" stop-opacity="0" />
    </linearGradient>

    <!-- Main Pumpkin Lobe Gradients (Volumetric 3D Shading) -->
    <!-- Far Outer Left Lobe -->
    <linearGradient id="p-lobe-far-left" x1="10%" y1="20%" x2="90%" y2="80%">
      <stop offset="0%" stop-color="#EA580C" />
      <stop offset="50%" stop-color="#C2410C" />
      <stop offset="100%" stop-color="#7C2D12" />
    </linearGradient>

    <!-- Far Outer Right Lobe -->
    <linearGradient id="p-lobe-far-right" x1="90%" y1="20%" x2="10%" y2="80%">
      <stop offset="0%" stop-color="#EA580C" />
      <stop offset="50%" stop-color="#C2410C" />
      <stop offset="100%" stop-color="#7C2D12" />
    </linearGradient>

    <!-- Mid Outer Left Lobe -->
    <linearGradient id="p-lobe-mid-left" x1="20%" y1="10%" x2="80%" y2="90%">
      <stop offset="0%" stop-color="#FF8A1F" />
      <stop offset="40%" stop-color="#FF6A00" />
      <stop offset="85%" stop-color="#9A3412" />
      <stop offset="100%" stop-color="#431407" />
    </linearGradient>

    <!-- Mid Outer Right Lobe -->
    <linearGradient id="p-lobe-mid-right" x1="80%" y1="10%" x2="20%" y2="90%">
      <stop offset="0%" stop-color="#FF8A1F" />
      <stop offset="40%" stop-color="#FF6A00" />
      <stop offset="85%" stop-color="#9A3412" />
      <stop offset="100%" stop-color="#431407" />
    </linearGradient>

    <!-- Inner Left Lobe -->
    <linearGradient id="p-lobe-inner-left" x1="30%" y1="0%" x2="70%" y2="100%">
      <stop offset="0%" stop-color="#FFB347" />
      <stop offset="35%" stop-color="#FF7A00" />
      <stop offset="80%" stop-color="#C2410C" />
      <stop offset="100%" stop-color="#7C2D12" />
    </linearGradient>

    <!-- Inner Right Lobe -->
    <linearGradient id="p-lobe-inner-right" x1="70%" y1="0%" x2="30%" y2="100%">
      <stop offset="0%" stop-color="#FFB347" />
      <stop offset="35%" stop-color="#FF7A00" />
      <stop offset="80%" stop-color="#C2410C" />
      <stop offset="100%" stop-color="#7C2D12" />
    </linearGradient>

    <!-- Central Center Lobe (Brightest, Front-facing) -->
    <linearGradient id="p-lobe-center" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#FFD180" />
      <stop offset="15%" stop-color="#FFA033" />
      <stop offset="45%" stop-color="#FF6A00" />
      <stop offset="85%" stop-color="#C2410C" />
      <stop offset="100%" stop-color="#7C2D12" />
    </linearGradient>

    <!-- Specular Gloss Highlight -->
    <linearGradient id="p-gloss" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.65" />
      <stop offset="40%" stop-color="#FFE0B2" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#FF7A00" stop-opacity="0" />
    </linearGradient>

    <!-- Sci-fi Orbital Halo Glow -->
    <filter id="p-glow-filter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Ambient Light Aura -->
  <circle cx="256" cy="270" r="230" fill="url(#p-ambient)" />

  <!-- Soft Base Drop Shadow -->
  <ellipse cx="256" cy="425" rx="175" ry="32" fill="url(#p-shadow)" />
  <ellipse cx="256" cy="420" rx="130" ry="20" fill="#000000" opacity="0.6" />

  <!-- PUMPKIN GROUP -->
  <g id="pumpkin-body" filter="url(#p-glow-filter)">
    <!-- ============================================== -->
    <!-- STEM (Talo / Pedúnculo) at Top Center -->
    <!-- ============================================== -->
    <!-- Stem Back Shadow -->
    <path d="M 248 165 C 244 130 252 95 278 72 C 286 65 298 62 308 65 C 314 67 312 76 304 80 C 284 92 276 115 272 165 Z" fill="#141E0A" opacity="0.8" />
    <!-- Stem Main Body with Organic Twist -->
    <path d="M 244 172 C 242 128 250 88 280 66 C 290 59 304 58 312 62 C 316 64 314 73 306 77 C 282 91 272 120 268 174 Z" fill="url(#p-stem)" />
    <!-- Stem Ridge Highlight -->
    <path d="M 252 170 C 250 130 258 98 282 74 C 288 68 296 66 302 68" stroke="url(#p-stem-highlight)" stroke-width="3" stroke-linecap="round" fill="none" />
    <!-- Stem Base Socket / Indentation -->
    <ellipse cx="256" cy="172" rx="28" ry="10" fill="#2E1107" />

    <!-- ============================================== -->
    <!-- LOBE LAYER 1: FAR OUTER LOBES (Silhouette Width) -->
    <!-- ============================================== -->
    <!-- Far Left Lobe -->
    <path d="M 256 172 C 215 168 120 185 86 240 C 56 288 64 350 102 388 C 136 422 198 428 256 426 Z" fill="url(#p-lobe-far-left)" />
    <!-- Far Right Lobe -->
    <path d="M 256 172 C 297 168 392 185 426 240 C 456 288 448 350 410 388 C 376 422 314 428 256 426 Z" fill="url(#p-lobe-far-right)" />

    <!-- ============================================== -->
    <!-- LOBE LAYER 2: MID LOBES (Depth & Curvature) -->
    <!-- ============================================== -->
    <!-- Mid Left Lobe -->
    <path d="M 256 172 C 210 166 142 184 122 238 C 100 296 112 360 148 396 C 182 430 226 432 256 430 Z" fill="url(#p-lobe-mid-left)" />
    <!-- Mid Right Lobe -->
    <path d="M 256 172 C 302 166 370 184 390 238 C 412 296 400 360 364 396 C 330 430 286 432 256 430 Z" fill="url(#p-lobe-mid-right)" />

    <!-- Deep groove lines between mid and inner lobes -->
    <path d="M 254 174 C 206 182 158 230 152 300 C 146 360 174 410 216 428" stroke="#3F1404" stroke-width="4.5" stroke-linecap="round" fill="none" opacity="0.65" />
    <path d="M 258 174 C 306 182 354 230 360 300 C 366 360 338 410 296 428" stroke="#3F1404" stroke-width="4.5" stroke-linecap="round" fill="none" opacity="0.65" />

    <!-- ============================================== -->
    <!-- LOBE LAYER 3: INNER FOREGROUND LOBES -->
    <!-- ============================================== -->
    <!-- Inner Left Lobe -->
    <path d="M 256 172 C 220 168 170 192 162 254 C 152 320 178 390 218 418 C 238 432 254 432 256 432 Z" fill="url(#p-lobe-inner-left)" />
    <!-- Inner Right Lobe -->
    <path d="M 256 172 C 292 168 342 192 350 254 C 360 320 334 390 294 418 C 274 432 258 432 256 432 Z" fill="url(#p-lobe-inner-right)" />

    <!-- Deep groove lines flanking the central lobe -->
    <path d="M 254 175 C 228 190 205 240 206 310 C 207 375 228 418 248 431" stroke="#451A03" stroke-width="5" stroke-linecap="round" fill="none" opacity="0.75" />
    <path d="M 258 175 C 284 190 307 240 306 310 C 305 375 284 418 264 431" stroke="#451A03" stroke-width="5" stroke-linecap="round" fill="none" opacity="0.75" />

    <!-- ============================================== -->
    <!-- LOBE LAYER 4: CENTER PROMINENT LOBE (Front 3D Bulb) -->
    <!-- ============================================== -->
    <path d="M 256 174 C 232 174 212 210 212 280 C 212 350 232 426 256 433 C 280 426 300 350 300 280 C 300 210 280 174 256 174 Z" fill="url(#p-lobe-center)" />

    <!-- ============================================== -->
    <!-- SPECULAR HIGHLIGHTS & GLOSS (Realistic Volume) -->
    <!-- ============================================== -->
    <!-- Center Lobe Specular Sheen -->
    <ellipse cx="256" cy="245" rx="24" ry="46" fill="url(#p-gloss)" />
    <ellipse cx="256" cy="225" rx="14" ry="22" fill="#FFFFFF" opacity="0.45" />

    <!-- Inner Left Highlight Streak -->
    <path d="M 188 230 C 182 258 184 290 194 316" stroke="#FFE0B2" stroke-width="4.5" stroke-linecap="round" fill="none" opacity="0.4" />
    <path d="M 188 230 C 184 250 186 270 190 285" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.6" />

    <!-- Inner Right Highlight Streak -->
    <path d="M 324 230 C 330 258 328 290 318 316" stroke="#FFE0B2" stroke-width="4.5" stroke-linecap="round" fill="none" opacity="0.4" />
    <path d="M 324 230 C 328 250 326 270 322 285" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.6" />

    <!-- Top Rim Light Arch -->
    <path d="M 150 216 C 180 190 230 182 256 182 C 282 182 332 190 362 216" stroke="#FFD8A8" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.5" />
  </g>

  <!-- High-Tech Pumpkin Orbit Ring (Subtle tech aesthetic tying to the app) -->
  <g opacity="0.6">
    <ellipse cx="256" cy="285" rx="205" ry="55" fill="none" stroke="#FF7A00" stroke-width="2" stroke-dasharray="14 18" transform="rotate(-12 256 285)" />
    <circle cx="95" cy="265" r="4" fill="#FFB347" />
    <circle cx="417" cy="305" r="4" fill="#FF8A1F" />
  </g>
</svg>
