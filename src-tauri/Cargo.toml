[package]
name = "pumpkin"
version = "1.0.2"
description = "pumpkin - Real-Time Voice, Chat & Screen Sharing"
authors = ["pumpkin team"]
license = "MIT"
repository = "https://github.com/nckfpsdev/Pumpkin"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = ["tray-icon"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[lib]
name = "pumpkin_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "z"
strip = true
