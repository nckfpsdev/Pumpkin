name: Release Multiplatform (Windows & Android)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows Desktop (.exe NSIS)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: Build Web Frontend
        run: npm run build

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2.0.0"

      - name: Build Windows Executable & Installer
        run: cargo tauri build --bundles nsis

      - name: Generate Windows SHA-256 Checksum
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path src-tauri/target/release/bundle/nsis/*.exe | Select-Object -First 1
          if ($exe) {
            $hash = (Get-FileHash -Path $exe.FullName -Algorithm SHA256).Hash
            "$hash  $($exe.Name)" | Out-File -FilePath checksums-windows.txt -Encoding utf8
            Write-Host "Windows checksum: $hash"
          }

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pumpkin-windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            checksums-windows.txt

  build-android:
    name: Build Android (.apk & .aab)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Rust & Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Install dependencies
        run: npm ci

      - name: Build Web Frontend
        run: npm run build

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2.0.0"

      - name: Build Android APK
        run: cargo tauri android build --apk

      - name: Build Android AAB
        run: cargo tauri android build --aab

      - name: Generate Android SHA-256 Checksum
        run: |
          find src-tauri/gen/android/app/build/outputs/apk/ -name "*.apk" -exec sha256sum {} + > checksums-android.txt
          cat checksums-android.txt

      - name: Upload Android Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pumpkin-android
          path: |
            src-tauri/gen/android/app/build/outputs/apk/**/*.apk
            src-tauri/gen/android/app/build/outputs/bundle/**/*.aab
            checksums-android.txt

  create-release:
    name: Create GitHub Release
    needs: [build-windows, build-android]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Compile Unified Checksums
        run: |
          cat pumpkin-windows/checksums-windows.txt pumpkin-android/checksums-android.txt > checksums.txt
          cat checksums.txt

      - name: Publish Release to GitHub
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            pumpkin-windows/*.exe
            pumpkin-android/**/*.apk
            pumpkin-android/**/*.aab
            checksums.txt
          draft: false
          prerelease: false
          name: Release ${{ github.ref_name }}
          body_path: public/releases/latest.json
