name: Windows Release

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (without v)'
        required: false
        default: '1.0.2'
      publish:
        description: 'Create/update GitHub Release after a successful build'
        required: false
        type: boolean
        default: true

permissions:
  contents: write

env:
  VITE_API_BASE_URL: ${{ vars.PUMPKIN_API_BASE_URL }}
  VITE_WS_URL: ${{ vars.PUMPKIN_WS_URL }}
  VITE_REPOSITORY_URL: https://github.com/nckfpsdev/Pumpkin

jobs:
  build-windows:
    name: Build & Validate Windows x64
    runs-on: windows-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      installer_name: ${{ steps.stage.outputs.installer_name }}
      installer_sha256: ${{ steps.stage.outputs.installer_sha256 }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve release metadata
        id: meta
        shell: pwsh
        run: |
          if ("${{ github.ref_type }}" -eq "tag") {
            $version = "${{ github.ref_name }}".TrimStart("v")
          } elseif ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $version = "${{ inputs.version }}"
          } else {
            $version = "1.0.2"
          }

          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "Invalid semantic version: $version"
          }

          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Require production backend for publishable builds
        shell: pwsh
        run: |
          $isRelease = ("${{ github.ref_type }}" -eq "tag") -or
                       ("${{ github.event_name }}" -eq "workflow_dispatch" -and "${{ inputs.publish }}" -eq "true")

          if ($isRelease) {
            if ([string]::IsNullOrWhiteSpace($env:VITE_API_BASE_URL)) {
              throw "Repository variable PUMPKIN_API_BASE_URL is required for a production desktop release."
            }
            if ([string]::IsNullOrWhiteSpace($env:VITE_WS_URL)) {
              throw "Repository variable PUMPKIN_WS_URL is required for a production desktop release."
            }
            if (-not $env:VITE_API_BASE_URL.StartsWith("https://")) {
              throw "PUMPKIN_API_BASE_URL must use HTTPS."
            }
            if (-not $env:VITE_WS_URL.StartsWith("wss://")) {
              throw "PUMPKIN_WS_URL must use WSS."
            }
            if ($env:VITE_API_BASE_URL -match 'ais-dev|aistudio|localhost|127\.0\.0\.1') {
              throw "PUMPKIN_API_BASE_URL points to a development/local endpoint."
            }
            if ($env:VITE_WS_URL -match 'ais-dev|aistudio|localhost|127\.0\.0\.1') {
              throw "PUMPKIN_WS_URL points to a development/local endpoint."
            }
          }

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Rust stable + Windows x64 target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install JavaScript dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run lint

      - name: Build frontend
        run: bun run build

      - name: Validate production frontend payload
        shell: pwsh
        run: |
          if (-not (Test-Path "dist/index.html")) {
            throw "dist/index.html was not generated."
          }

          $jsFiles = Get-ChildItem "dist/assets" -Filter "*.js" -File -ErrorAction SilentlyContinue
          if (-not $jsFiles) {
            throw "No JavaScript bundle found in dist/assets."
          }

          $foundNickname = Select-String -Path $jsFiles.FullName -Pattern "Entrar no pumpkin" -SimpleMatch -Quiet
          if (-not $foundNickname) {
            throw "The built frontend does not contain the real Pumpkin nickname/app flow."
          }

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2.0.0" --locked

      - name: Build Tauri Windows x64 + NSIS
        run: cargo tauri build --target x86_64-pc-windows-msvc --bundles nsis

      - name: Validate native Pumpkin executable
        shell: pwsh
        run: |
          $native = "src-tauri/target/x86_64-pc-windows-msvc/release/pumpkin.exe"
          & "./scripts/validate-windows-release.ps1" -Path $native -Expected x64

      - name: Stage and validate NSIS installer
        id: stage
        shell: pwsh
        run: |
          $version = "${{ steps.meta.outputs.version }}"
          $nsisDir = "src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis"
          $installers = @(Get-ChildItem -Path $nsisDir -Filter "*.exe" -File)

          if ($installers.Count -ne 1) {
            throw "Expected exactly one NSIS installer in $nsisDir, found $($installers.Count)."
          }

          New-Item -ItemType Directory -Path "release" -Force | Out-Null
          $installerName = "pumpkin-Setup-$version-windows-x64.exe"
          $staged = Join-Path "release" $installerName

          Copy-Item -LiteralPath $installers[0].FullName -Destination $staged -Force
          & "./scripts/validate-windows-release.ps1" -Path $staged -Expected installer

          $hash = (Get-FileHash -LiteralPath $staged -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $installerName" | Set-Content -LiteralPath "release/checksums.txt" -Encoding ascii

          "installer_name=$installerName" >> $env:GITHUB_OUTPUT
          "installer_sha256=$hash" >> $env:GITHUB_OUTPUT

      - name: Upload validated build artifact
        uses: actions/upload-artifact@v4
        with:
          name: pumpkin-windows-x64-${{ steps.meta.outputs.version }}
          if-no-files-found: error
          path: |
            release/pumpkin-Setup-*-windows-x64.exe
            release/checksums.txt

  publish-release:
    name: Publish & Round-trip Verify GitHub Release
    needs: build-windows
    if: >
      github.ref_type == 'tag' ||
      (github.event_name == 'workflow_dispatch' && inputs.publish == true)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download validated artifact
        uses: actions/download-artifact@v4
        with:
          name: pumpkin-windows-x64-${{ needs.build-windows.outputs.version }}
          path: release

      - name: Revalidate downloaded workflow artifact
        shell: pwsh
        run: |
          $installer = "release/${{ needs.build-windows.outputs.installer_name }}"
          & "./scripts/validate-windows-release.ps1" -Path $installer -Expected installer
          $actual = (Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne "${{ needs.build-windows.outputs.installer_sha256 }}") {
            throw "Workflow artifact SHA-256 mismatch."
          }

      - name: Create or update GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = "${{ needs.build-windows.outputs.version }}"
          $tag = "v$version"
          $installer = "release/${{ needs.build-windows.outputs.installer_name }}"
          $checksums = "release/checksums.txt"

          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag $installer $checksums --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "Pumpkin $version" --notes "Windows x64 community release. Unsigned build; SHA-256 is published in checksums.txt."
          } else {
            gh release upload $tag $installer $checksums --repo $env:GITHUB_REPOSITORY --clobber
          }

      - name: Resolve real browser_download_url and round-trip verify
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = "${{ needs.build-windows.outputs.version }}"
          $tag = "v$version"
          $assetName = "${{ needs.build-windows.outputs.installer_name }}"
          $release = gh api "repos/$env:GITHUB_REPOSITORY/releases/tags/$tag" | ConvertFrom-Json
          $asset = @($release.assets | Where-Object { $_.name -eq $assetName })

          if ($asset.Count -ne 1) {
            throw "Expected exactly one published asset named $assetName."
          }

          if ([string]::IsNullOrWhiteSpace($asset[0].browser_download_url)) {
            throw "GitHub did not return browser_download_url for $assetName."
          }

          Write-Host "Release URL: $($release.html_url)"
          Write-Host "Asset ID: $($asset[0].id)"
          Write-Host "Asset size: $($asset[0].size)"
          Write-Host "Asset URL: $($asset[0].browser_download_url)"

          & "./scripts/verify-release-download.ps1" -Url $asset[0].browser_download_url -ExpectedSha256 "${{ needs.build-windows.outputs.installer_sha256 }}"
